name: build-openclaw-sandbox

# Builds the OpenClaw sandbox image (images/openclaw-sandbox) and publishes it as
#   ghcr.io/<owner>/<repo>/openclaw-sandbox:<version>
# A package named under the repository is created by this workflow on the first
# push and linked to this repo, so GITHUB_TOKEN can write to it. Packages in a
# public repo are public, so k3s pulls without a pull secret. The gateway's
# default image is sandbox_image_repository/_tag in ansible/inventory/group_vars/all.yml.
# Runs on changes under images/openclaw-sandbox/, or from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: OpenClaw npm version to bake in
        default: "2026.11.3"
  push:
    paths:
      - images/openclaw-sandbox/**
      - .github/workflows/build-openclaw-sandbox.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.openclaw_version || '2026.11.3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/openclaw-sandbox
          push: true
          build-args: |
            OPENCLAW_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}/openclaw-sandbox:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}/openclaw-sandbox:latest
