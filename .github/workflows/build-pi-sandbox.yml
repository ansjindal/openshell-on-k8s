name: build-pi-sandbox

# Builds the pi sandbox image (images/pi-sandbox) and publishes it as
#   ghcr.io/<owner>/<repo>/pi-sandbox:<version>
# A package named under the repository is created by this workflow on the first
# push and linked to this repo, so GITHUB_TOKEN can write to it. Packages in a
# public repo are public, so k3s pulls without a pull secret. The gateway's
# default image is sandbox_image_repository/_tag in ansible/inventory/group_vars/all.yml.
# Runs on changes under images/pi-sandbox/, or from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      pi_version:
        description: pi npm version to bake in
        default: "1.5.2"
  push:
    paths:
      - images/pi-sandbox/**
      - .github/workflows/build-pi-sandbox.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.pi_version || '1.5.2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/pi-sandbox
          push: true
          build-args: |
            PI_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}/pi-sandbox:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}/pi-sandbox:latest
