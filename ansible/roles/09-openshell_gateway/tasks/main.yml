---
# Install the OpenShell gateway (official Helm chart). Adds the gVisor overlay
# (sandbox pods on RuntimeClass gvisor) when gvisor_enabled.
- name: OpenShell gateway
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  block:
    - name: Ensure gateway + sandbox namespaces
      ansible.builtin.shell: |
        for ns in {{ openshell_namespace }} {{ k3s_sandbox_namespace }}; do
          kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
        done
      args: { executable: /bin/bash }
      changed_when: false

    - name: Copy gateway values
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/tmp/openshell-{{ item }}"
        mode: "0644"
      loop:
        - values.yaml
        - values.gvisor.yaml

    - name: Render OIDC overlay (when auth_mode == oidc)
      ansible.builtin.template:
        src: values.oidc.yaml.j2
        dest: /tmp/openshell-values.oidc.yaml
        mode: "0644"
      when: auth_mode == 'oidc'

    - name: Render Postgres overlay (when gateway_db_backend == postgres)
      ansible.builtin.template:
        src: values.postgres.yaml.j2
        dest: /tmp/openshell-values.postgres.yaml
        mode: "0644"
      when: gateway_db_backend | default('sqlite') == 'postgres'

    - name: Copy mTLS overlay (when cert_manager_enabled)
      ansible.builtin.copy:
        src: values.mtls.yaml
        dest: /tmp/openshell-values.mtls.yaml
        mode: "0644"
      when: cert_manager_enabled | bool

    - name: Copy OTLP overlay (when openshell_otlp_enabled)
      ansible.builtin.copy:
        src: values.otlp.yaml
        dest: /tmp/openshell-values.otlp.yaml
        mode: "0644"
      when: openshell_otlp_enabled | bool

    # Switching backends flips the workload kind (StatefulSet <-> Deployment).
    # Helm won't change an existing object's kind in place, so drop the stale
    # workload first when it doesn't match the target kind.
    - name: Reconcile workload kind for the DB backend
      ansible.builtin.shell: |
        stale="{{ 'statefulset' if (gateway_db_backend | default('sqlite') == 'postgres') else 'deployment' }}"
        kubectl -n {{ openshell_namespace }} delete "$stale" openshell --ignore-not-found
      args: { executable: /bin/bash }
      changed_when: false

    - name: Install OpenShell gateway
      ansible.builtin.shell: |
        helm upgrade --install openshell {{ openshell_chart }} \
          --version {{ openshell_chart_version }} \
          --namespace {{ openshell_namespace }} \
          --set server.sandboxNamespace={{ k3s_sandbox_namespace }} \
          -f /tmp/openshell-values.yaml \
          {{ '-f /tmp/openshell-values.gvisor.yaml' if (gvisor_enabled | bool) else '' }} \
          {{ '-f /tmp/openshell-values.oidc.yaml' if (auth_mode == 'oidc') else '' }} \
          {{ '-f /tmp/openshell-values.postgres.yaml' if (gateway_db_backend | default('sqlite') == 'postgres') else '' }} \
          {{ '-f /tmp/openshell-values.mtls.yaml' if (cert_manager_enabled | bool) else '' }} \
          {{ '-f /tmp/openshell-values.otlp.yaml' if (openshell_otlp_enabled | bool) else '' }} \
          --wait --timeout 8m
      args: { executable: /bin/bash }
      changed_when: true

    - name: Wait for the gateway to roll out
      ansible.builtin.command: >-
        kubectl -n {{ openshell_namespace }}
        rollout status {{ 'deployment' if (gateway_db_backend | default('sqlite') == 'postgres') else 'statefulset' }}/openshell
        --timeout=300s
      changed_when: false
      failed_when: false

    # Sandbox pods mount openshell-client-tls to auth back to the gateway over
    # mTLS, but they land in k3s_sandbox_namespace — a namespace SEPARATE from
    # the gateway's release namespace by design (isolation). Secrets don't cross
    # namespaces, and cert-manager only creates this one where the chart is
    # installed, so replicate it — otherwise every sandbox pod sits in
    # Init:0/2 forever on "secret openshell-client-tls not found".
    - name: Wait for the client mTLS secret to exist
      ansible.builtin.command: >-
        kubectl -n {{ openshell_namespace }} get secret openshell-client-tls -o name
      register: _client_tls_secret
      changed_when: false
      retries: 15
      delay: 4
      until: _client_tls_secret.rc == 0
      when: k3s_sandbox_namespace != openshell_namespace

    - name: Copy the client mTLS secret into the sandbox namespace
      ansible.builtin.shell: |
        set -e
        tls_crt="$(kubectl -n {{ openshell_namespace }} get secret openshell-client-tls -o jsonpath='{.data.tls\.crt}')"
        tls_key="$(kubectl -n {{ openshell_namespace }} get secret openshell-client-tls -o jsonpath='{.data.tls\.key}')"
        ca_crt="$(kubectl -n {{ openshell_namespace }} get secret openshell-client-tls -o jsonpath='{.data.ca\.crt}')"
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: Secret
        type: kubernetes.io/tls
        metadata:
          name: openshell-client-tls
          namespace: {{ k3s_sandbox_namespace }}
        data:
          tls.crt: $tls_crt
          tls.key: $tls_key
          ca.crt: $ca_crt
        EOF
      args: { executable: /bin/bash }
      when: k3s_sandbox_namespace != openshell_namespace
      changed_when: true
