---
# Install the OpenShell gateway (official Helm chart, 0.1.x) and give the VM's
# operator tooling (CLI, scripts, teaching site) an OU=operator client
# certificate.
- name: OpenShell gateway
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  block:
    - name: Ensure the gateway namespace
      ansible.builtin.shell: |
        kubectl create namespace {{ openshell_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      args: { executable: /bin/bash }
      changed_when: false

    - name: Copy gateway values
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/tmp/openshell-{{ item }}"
        mode: "0644"
      loop:
        - values.yaml
        - values.mtls.yaml
        - values.otlp.yaml

    - name: Render OIDC overlay (when auth_mode == oidc)
      ansible.builtin.template:
        src: values.oidc.yaml.j2
        dest: /tmp/openshell-values.oidc.yaml
        mode: "0644"
      when: auth_mode == 'oidc'

    - name: Render Postgres overlay (when gateway_db_backend == postgres)
      ansible.builtin.template:
        src: values.postgres.yaml.j2
        dest: /tmp/openshell-values.postgres.yaml
        mode: "0644"
      when: gateway_db_backend | default('sqlite') == 'postgres'

    # Switching backends flips the workload kind (StatefulSet <-> Deployment).
    # Helm won't change an existing object's kind in place, so drop the stale
    # workload first when it doesn't match the target kind.
    - name: Reconcile workload kind for the DB backend
      ansible.builtin.shell: |
        stale="{{ 'statefulset' if (gateway_db_backend | default('sqlite') == 'postgres') else 'deployment' }}"
        kubectl -n {{ openshell_namespace }} delete "$stale" openshell --ignore-not-found
      args: { executable: /bin/bash }
      changed_when: false

    - name: Install OpenShell gateway
      ansible.builtin.shell: |
        helm upgrade --install openshell {{ openshell_chart }} \
          --version {{ openshell_chart_version }} \
          --namespace {{ openshell_namespace }} \
          --set sandbox.image.repository={{ sandbox_image_repository }} \
          --set-string sandbox.image.tag={{ sandbox_image_tag }} \
          -f /tmp/openshell-values.yaml \
          {{ '-f /tmp/openshell-values.mtls.yaml' if (cert_manager_enabled | bool) else '' }} \
          {{ '-f /tmp/openshell-values.otlp.yaml' if (openshell_otlp_enabled | bool) else '' }} \
          {{ '-f /tmp/openshell-values.oidc.yaml' if (auth_mode == 'oidc') else '' }} \
          {{ '-f /tmp/openshell-values.postgres.yaml' if (gateway_db_backend | default('sqlite') == 'postgres') else '' }} \
          --wait --timeout 10m
      args: { executable: /bin/bash }
      changed_when: true

    - name: Wait for the gateway to roll out
      ansible.builtin.command: >-
        kubectl -n {{ openshell_namespace }}
        rollout status {{ 'deployment' if (gateway_db_backend | default('sqlite') == 'postgres') else 'statefulset' }}/openshell
        --timeout=300s
      changed_when: false

    # The chart's Service is ClusterIP; publish the gRPC port on a fixed
    # NodePort so the CLI on the VM reaches https://localhost:<gateway_nodeport>
    # (localhost is in the server certificate's SANs; 127.0.0.1 is too).
    - name: Publish the gateway on NodePort {{ gateway_nodeport }}
      ansible.builtin.shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: Service
        metadata:
          name: openshell-nodeport
          namespace: {{ openshell_namespace }}
        spec:
          type: NodePort
          selector:
            app.kubernetes.io/name: openshell
            app.kubernetes.io/instance: openshell
          ports:
            - name: grpc
              port: 8080
              targetPort: 8080
              nodePort: {{ gateway_nodeport }}
        EOF
      args: { executable: /bin/bash }
      changed_when: false

    # OU=operator => platform admin across all workspaces (mtls_auth.operator_enabled
    # in values.yaml). Issued by the chart's own CA, so the gateway trusts it.
    # Only the VM's root/lab user ever gets this key.
    - name: Issue the operator client certificate (OU=operator)
      ansible.builtin.shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: openshell-operator
          namespace: {{ openshell_namespace }}
        spec:
          secretName: openshell-operator-tls
          commonName: lab-operator
          subject:
            organizationalUnits: [operator]
          duration: 2160h
          renewBefore: 360h
          privateKey: {algorithm: ECDSA, size: 256}
          usages: [client auth, digital signature, key encipherment]
          issuerRef:
            name: openshell-ca-issuer
            kind: Issuer
        EOF
      args: { executable: /bin/bash }
      changed_when: false
      when: cert_manager_enabled | bool

    - name: Wait for the operator certificate
      ansible.builtin.shell: |
        kubectl -n {{ openshell_namespace }} get secret openshell-operator-tls -o jsonpath='{.data.tls\.crt}'
      register: _operator_tls
      changed_when: false
      retries: 30
      delay: 4
      until: _operator_tls.rc == 0 and (_operator_tls.stdout | length) > 0
      when: cert_manager_enabled | bool
