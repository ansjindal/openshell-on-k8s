# Values for the official OpenShell gateway Helm chart (0.1.x line).
#   chart: oci://ghcr.io/nvidia/openshell/helm-chart   (version: openshell_chart_version)
#
# The gateway is the control plane. Its Kubernetes compute driver turns each
# sandbox request into an agents.x-k8s.io Sandbox (the workload pod) plus a
# supervisor pod that enforces the sandbox policy. Model access is a provider
# attached to the sandbox (roles/10-cli_providers), not a gateway route.
#
# Before bumping the chart, diff the values:
#   helm show values oci://ghcr.io/nvidia/openshell/helm-chart --version <new>
# Overlays applied on top (see tasks/main.yml): values.mtls.yaml,
# values.otlp.yaml, values.oidc.yaml.j2, values.postgres.yaml.j2.
#
# Isolation: each sandbox is two pods. The workload pod runs the agent under
# Landlock (ABI v3+), seccomp and a sandbox user, and a NetworkPolicy lets it
# talk only to its supervisor pod; the supervisor pod enforces the network
# policy (L4/L7), injects credentials and writes the OCSF audit trail.
# gVisor cannot host the workload: it implements neither Landlock nor the
# seccomp notifications the 0.1.x sandbox runtime requires.

# StatefulSet + bundled SQLite: one replica, no database to run.
workload:
  kind: statefulset

# The NodePort (gateway_nodeport, 30808) is a separate Service created by the
# role; the chart's own Service stays ClusterIP.
service:
  type: ClusterIP
  port: 8080

server:
  logLevel: info
  # Anonymous usage telemetry to NVIDIA; turn off if your policy requires it.
  telemetryEnabled: true
  # TLS on the gateway API (chart default).
  disableTls: false
  auth:
    # Never accept anonymous callers. Browser users (the console) sign in with
    # Keycloak; the lab's CLI uses an mTLS operator certificate (see below).
    allowUnauthenticatedUsers: false
  # A policy that fails validation deactivates the previous one.
  policyValidationFailureMode: fail_closed
  drivers:
    kubernetes:
      # Every workspace shares one sandbox namespace (the role sets
      # server.sandboxNamespace to k3s_sandbox_namespace), separate from the
      # gateway's own namespace.
      workspaceMode: shared
      # Resource admission: a sandbox may use a cluster resource (RuntimeClass,
      # PriorityClass, volumes) only when it carries the operator's approval
      # labels: openshell.ai/sandbox-attachable=true and
      # openshell.ai/sandbox-attachable-workspace=<workspace>.
      resourceAdmission:
        enabled: true

gatewayConfig:
  # The lab's CLI, scripts and teaching site run on the VM as a trusted
  # operator: a client certificate with OU=operator (Certificate
  # openshell-operator, issued by the chart's CA) is a platform admin across
  # all workspaces. Nobody else gets a certificate; people sign in with Keycloak.
  openshell.gateway.mtls_auth:
    operator_enabled: true

serviceAccount:
  create: true
sandboxServiceAccount:
  create: true
networkPolicy:
  enabled: true
