# Loki (grafana/loki chart 7.x, Loki 3.x), single-binary mode on the local
# filesystem: one StatefulSet, plenty for a lab.
#
# Two streams land here:
#   - every pod's logs, shipped by Alloy (labels namespace/pod/container/app);
#     sandbox supervisors print one "OCSF ..." line per allow/deny decision;
#   - OpenShell's OCSF audit events over OTLP (/otlp), with their attributes
#     (openshell.sandbox.id, ocsf.class_uid, ...) kept as structured metadata.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    allow_structured_metadata: true   # OTLP attributes (sandbox id, OCSF class, ...)
    volume_enabled: true
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1536Mi}

# Single-binary only: no microservices components, caches, gateway or canary.
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}

monitoring:
  serviceMonitor:
    enabled: true
