---
# Create fleet_size sandboxes (agent-0..N-1) through the openshell CLI. Each one
# starts from the lab baseline policy (deny all network), gets the `litellm`
# provider attached (model access + a placeholder key) and keeps running
# `sleep infinity` so lessons and scripts can exec into it. Idempotent: an
# existing name is left as it is. Runs after the gateway (09) and the provider (10).
- name: Create the sandbox fleet
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    NO_COLOR: "1"
  block:
    - name: Create sandboxes through the gateway
      ansible.builtin.shell: |
        set -euo pipefail
        existing="$(openshell sandbox list 2>/dev/null | awk 'NR>1{print $1}')"
        for i in $(seq 0 {{ (fleet_size | int) - 1 }}); do
          name="{{ sandbox_name_prefix }}-${i}"
          if echo "$existing" | grep -qx "$name"; then echo "$name (already exists)"; continue; fi
          # --detach: create and return; the main process keeps the sandbox alive.
          timeout 300 openshell sandbox create --name "$name" \
            --provider {{ sandbox_provider }} \
            --policy {{ playbook_dir }}/../manifests/policies/baseline.yaml \
            --memory {{ sandbox_memory }} \
            --env LITELLM_MODEL=default \
            --no-tty --detach -- sleep infinity </dev/null >/dev/null
          echo "created $name"
        done
      args: { executable: /bin/bash }
      register: sb_create
      changed_when: "'created' in sb_create.stdout"

    - name: Wait for the fleet to be Ready
      ansible.builtin.shell: |
        openshell sandbox list 2>/dev/null | awk 'NR>1 && $1 ~ /^{{ sandbox_name_prefix }}-/ && $NF != "Ready" {print $1}'
      args: { executable: /bin/bash }
      register: _not_ready
      retries: 36
      delay: 5
      until: _not_ready.rc == 0 and (_not_ready.stdout | length) == 0
      changed_when: false

    - name: Sandbox fleet summary
      ansible.builtin.debug:
        msg:
          - "{{ fleet_size }} sandbox(es) {{ sandbox_name_prefix }}-0..{{ (fleet_size | int) - 1 }}, provider {{ sandbox_provider }}, policy manifests/policies/baseline.yaml."
          - "{{ sb_create.stdout_lines | default([]) }}"
          - "Runtime ops: ./scripts/fleet status | task | shell | logs"
