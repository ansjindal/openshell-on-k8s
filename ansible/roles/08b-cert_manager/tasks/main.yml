---
# cert-manager — issues the OpenShell gateway's mTLS material (see role
# 09-openshell_gateway's values.mtls.yaml). Runs before the gateway role: the
# chart's certManager.enabled path creates Issuer/Certificate CRs that need
# cert-manager's CRDs + controller already present to reconcile.
- name: cert-manager
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: cert_manager_enabled | bool
  block:
    - name: Ensure cert-manager namespace
      ansible.builtin.shell: |
        kubectl create namespace {{ cert_manager_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      args: { executable: /bin/bash }
      changed_when: false

    - name: Install cert-manager (with CRDs)
      ansible.builtin.shell: |
        helm upgrade --install cert-manager {{ cert_manager_chart }} \
          --version {{ cert_manager_chart_version }} \
          --namespace {{ cert_manager_namespace }} \
          --set crds.enabled=true \
          --wait --timeout 6m
      args: { executable: /bin/bash }
      changed_when: true

    - name: Wait for the cert-manager webhook to be ready
      ansible.builtin.command: >-
        kubectl -n {{ cert_manager_namespace }}
        rollout status deployment/cert-manager-webhook --timeout=180s
      changed_when: false

    # Lab CA: a self-signed root that signs in-cluster HTTPS for the public host
    # (Keycloak's own TLS port, role 07). In-cluster clients (the OpenShell
    # gateway, the console's auth proxy) trust it through ConfigMap
    # {{ lab_ca_bundle_configmap }}, which holds the public roots + this CA.
    - name: Create the lab CA (self-signed root + ClusterIssuer {{ lab_ca_issuer }})
      ansible.builtin.shell: |
        cat <<YAML | kubectl apply -f -
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: lab-selfsigned
        spec:
          selfSigned: {}
        ---
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: lab-ca
          namespace: {{ cert_manager_namespace }}
        spec:
          isCA: true
          commonName: OpenShell Lab CA
          secretName: lab-ca
          duration: 87600h
          privateKey: {algorithm: ECDSA, size: 256}
          issuerRef: {name: lab-selfsigned, kind: ClusterIssuer}
        ---
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: {{ lab_ca_issuer }}
        spec:
          ca:
            secretName: lab-ca
        YAML
      args: { executable: /bin/bash }
      register: _lab_ca
      retries: 10
      delay: 6
      until: _lab_ca.rc == 0
      changed_when: false

    - name: Wait for the lab CA certificate
      ansible.builtin.shell: |
        kubectl -n {{ cert_manager_namespace }} get secret lab-ca -o jsonpath='{.data.ca\.crt}'
      register: _lab_ca_crt
      changed_when: false
      retries: 30
      delay: 4
      until: _lab_ca_crt.rc == 0 and (_lab_ca_crt.stdout | length) > 0

    # The gateway points SSL_CERT_FILE at the OIDC CA bundle, so the bundle must
    # include the public roots as well as the lab CA.
    - name: Publish the CA bundle (public roots + lab CA) to the namespaces that need it
      ansible.builtin.shell: |
        set -euo pipefail
        bundle="$(mktemp)"
        cat /etc/ssl/certs/ca-certificates.crt > "$bundle"
        echo >> "$bundle"
        echo '{{ _lab_ca_crt.stdout }}' | base64 -d >> "$bundle"
        echo '{{ _lab_ca_crt.stdout }}' | base64 -d > "${bundle}.ca"
        for ns in {{ openshell_namespace }} {{ keycloak_namespace }}; do
          kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
          kubectl -n "$ns" create configmap {{ lab_ca_bundle_configmap }} \
            --from-file=ca.crt="$bundle" --from-file=lab-ca.crt="${bundle}.ca" \
            --dry-run=client -o yaml | kubectl apply -f -
        done
        rm -f "$bundle" "${bundle}.ca"
      args: { executable: /bin/bash }
      changed_when: false
