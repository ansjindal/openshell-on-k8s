---
# Exposes OpenClaw's own web control UI (the chat/device-pairing interface
# `openclaw gateway run --port <N>` serves inside the sandbox) to a browser.
# That port lives inside the sandbox's sealed network namespace — no plain
# k3s Service/NodePort/Ingress can reach it — so the only way out is a
# persistent `openshell forward` tunnel (gateway -> supervisor -> sandbox ->
# host port), supervised here as a systemd unit. Optional; runs only when
# openclaw_ui_enabled. Must run AFTER the target sandbox exists (16-sandboxes).
- name: OpenClaw UI port-forward
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  block:
    - name: Install the openshell CLI (if missing)
      ansible.builtin.shell: |
        set -e
        command -v openshell >/dev/null 2>&1 && exit 0
        curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/main/install.sh | sh
        ln -sf "$HOME/.local/bin/openshell" /usr/local/bin/openshell 2>/dev/null || true
      args: { executable: /bin/bash }
      changed_when: false
      failed_when: false

    # systemd's ExecStart needs an absolute path (no PATH lookup) — resolve
    # wherever `openshell` actually landed (install.sh's ~/.local/bin symlinked
    # to /usr/local/bin, an apt/deb package under /usr/bin, ...) rather than
    # hardcoding one, since we've seen both locations across installs.
    - name: Resolve the openshell CLI's absolute path
      ansible.builtin.shell: command -v openshell
      args: { executable: /bin/bash }
      register: _openshell_bin
      changed_when: false

    # `openclaw gateway run` only ever binds a port INSIDE the sandbox — nothing
    # starts it automatically, and a bare sandbox has no systemd to supervise it.
    # Everything below runs the in-sandbox setup once via `sandbox exec`, piping
    # each script in base64 (`sandbox exec ... -- sh -c "echo <b64> | base64 -d |
    # sh"`) rather than passing it as a literal argument or over stdin — plain
    # multi-line/quoted args got mangled across the CLI's own arg parsing, and
    # piping a script over stdin never returned at all (verified live: `sandbox
    # exec -- sh < script.sh` hangs indefinitely; the single -c-argument form
    # nemoclaw's equivalent script uses is what actually returns).
    - name: Allow the Control UI to be reached from any browser origin
      # Default browser-origin check only allows http://localhost:<port> and
      # http://127.0.0.1:<port> — anything reached via a public/Brev URL would
      # be rejected. Verified live: setting this to a wildcard and reconnecting
      # with an arbitrary Origin header still completes the WebSocket upgrade
      # (HTTP 101), so it genuinely opens it up, not just silences a warning.
      ansible.builtin.shell: |
        set -e
        payload='openclaw config set gateway.controlUi.allowedOrigins "[\"*\"]"'
        b64="$(printf '%s' "$payload" | base64 | tr -d '\n')"
        openshell --gateway fleet sandbox exec -n {{ openclaw_ui_agent }} -- sh -c "echo $b64 | base64 -d | sh"
      args: { executable: /bin/bash }
      changed_when: false
      failed_when: false

    # Requests arrive via the Brev edge's own reverse proxy (a separate Secure
    # Link subdomain fronting the forwarded port), which adds X-Forwarded-For/
    # -Proto headers OpenClaw doesn't trust by default — it refuses the request
    # with "proxy_attribution_required" (verified live). The actual immediate
    # peer as OpenClaw sees it is the openshell forward tunnel terminating
    # inside the sandbox's own netns (loopback), not Brev's edge IP, so
    # trusting loopback is enough — confirmed live with a spoofed
    # X-Forwarded-For header completing a real WebSocket upgrade (HTTP 101).
    - name: Trust the local forward tunnel's proxy headers
      ansible.builtin.shell: |
        set -e
        payload='openclaw config set gateway.trustedProxies "[\"127.0.0.1\",\"::1\"]"'
        b64="$(printf '%s' "$payload" | base64 | tr -d '\n')"
        openshell --gateway fleet sandbox exec -n {{ openclaw_ui_agent }} -- sh -c "echo $b64 | base64 -d | sh"
      args: { executable: /bin/bash }
      changed_when: false
      failed_when: false

    # Closes the long-documented KNOWN GAP (.env.example): OpenClaw's own model
    # calls don't route through inference.local via env vars the way
    # claude/codex/opencode do — it needs its own provider onboarded. Uses
    # inference_model (the same model LiteLLM is already configured to serve,
    # from 10-inference_routing) with a PLACEHOLDER apiKey, never the real
    # upstream key — the whole point of inference.local is that the sandbox's
    # policy proxy injects the real credential, so the agent never holds it.
    #
    # baseUrl MUST include /v1 — verified live: OpenClaw's OpenAI-completions
    # client builds requests as `${baseUrl}/chat/completions`; with a bare
    # `https://inference.local` that lands on `/chat/completions` (no /v1),
    # which falls OUTSIDE the supervisor's special-cased inference.local
    # interception path and hits the normal egress policy instead — which then
    # denies it (no allow-rule for that bare host/binary), surfacing as a
    # misleading "authentication failed, HTTP 403" in OpenClaw's UI when the
    # gateway log's actual rawError is "connection not allowed by policy".
    - name: Onboard OpenClaw's own provider to route through inference.local
      ansible.builtin.shell: |
        set -e
        payload='openclaw onboard --non-interactive --accept-risk --skip-health --skip-ui --skip-daemon --skip-channels --skip-hooks --skip-search --skip-skills --skip-bootstrap --auth-choice custom-api-key --custom-provider-id litellm --custom-base-url https://inference.local/v1 --custom-api-key unused --custom-model-id {{ inference_model }} --custom-compatibility openai --custom-text-input'
        b64="$(printf '%s' "$payload" | base64 | tr -d '\n')"
        openshell --gateway fleet sandbox exec -n {{ openclaw_ui_agent }} -- sh -c "echo $b64 | base64 -d | sh"
      args: { executable: /bin/bash }
      changed_when: false
      failed_when: false

    # Without this, plain `openclaw agent`/other bare CLI calls (no explicit
    # --url/--password, unlike the devices-list/-approve tasks above which
    # always pass them) fall back to config defaults (port 18789, no password)
    # instead of the port/auth this gateway actually runs with — verified live
    # ("Gateway not reachable at ws://127.0.0.1:18789").
    - name: Point the CLI's own gateway target at this gateway's real port + password
      ansible.builtin.shell: |
        set -e
        payload='openclaw config set gateway.port {{ openclaw_ui_port }} && openclaw config set gateway.auth.password "{{ openclaw_gateway_password }}"'
        b64="$(printf '%s' "$payload" | base64 | tr -d '\n')"
        openshell --gateway fleet sandbox exec -n {{ openclaw_ui_agent }} -- sh -c "echo $b64 | base64 -d | sh"
      args: { executable: /bin/bash }
      changed_when: false
      failed_when: false

    - name: Start (or restart) the in-sandbox OpenClaw Control UI gateway
      ansible.builtin.shell: |
        set -e
        script='cd /sandbox
        [ -f gateway.pid ] && kill "$(cat gateway.pid)" 2>/dev/null
        sleep 1
        setsid nohup openclaw gateway run --port {{ openclaw_ui_port }} --bind lan --auth password --password "{{ openclaw_gateway_password }}" --allow-unconfigured > /sandbox/gateway.log 2>&1 < /dev/null &
        echo $! > /sandbox/gateway.pid
        sleep 6
        tail -20 /sandbox/gateway.log'
        b64="$(printf '%s' "$script" | base64 | tr -d '\n')"
        openshell --gateway fleet sandbox exec -n {{ openclaw_ui_agent }} -- sh -c "echo $b64 | base64 -d | sh"
      args: { executable: /bin/bash }
      register: _openclaw_ui_start
      changed_when: "'[gateway] ready' in _openclaw_ui_start.stdout"
      failed_when: false

    # NOTE on device pairing: an earlier version of this task tried to port the
    # sibling nemoclaw-openshift-launchable's admin-bootstrap trick (patch a
    # devices/paired.json file to grant the first device admin scope, working
    # around a "first browser can't approve its own pairing" deadlock on older
    # OpenClaw). Verified live against OpenClaw 2026.8.2 that this doesn't
    # apply here: device-pairing state now lives in a SQLite DB
    # (.openclaw/state/openclaw.sqlite), no devices/paired.json exists at all,
    # AND `--auth password` auto-pairs a correctly-authenticated client
    # immediately (confirmed via `openclaw devices list`: status "Paired", not
    # "Pending") — there's no separate approval step to unblock. Dropped the
    # bootstrap entirely rather than ship a step that silently no-ops.

    - name: Render the openclaw-forward systemd unit
      ansible.builtin.template:
        src: openclaw-forward.service.j2
        dest: /etc/systemd/system/openclaw-forward.service
        owner: root
        group: root
        mode: "0644"
      register: openclaw_forward_unit

    - name: Enable and (re)start openclaw-forward
      ansible.builtin.systemd:
        name: openclaw-forward
        daemon_reload: true
        enabled: true
        state: restarted

    - name: OpenClaw UI forward summary
      ansible.builtin.debug:
        msg:
          - "OpenClaw UI forwarded: host port {{ openclaw_ui_port }} -> sandbox {{ openclaw_ui_agent }}."
          - "Open Brev port {{ openclaw_ui_port }}, or locally: http://localhost:{{ openclaw_ui_port }}/"
          - "Control UI password: {{ openclaw_gateway_password }} (override via OPENCLAW_GATEWAY_PASSWORD in .env)."
          - "Managed by systemd unit 'openclaw-forward' (Restart=always — self-heals once the sandbox is Ready)."
