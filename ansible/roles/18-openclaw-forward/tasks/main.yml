---
# Exposes OpenClaw's own web control UI (the chat/device-pairing interface
# `openclaw gateway run --port <N>` serves inside the sandbox) to a browser.
# That port lives inside the sandbox's sealed network namespace — no plain
# k3s Service/NodePort/Ingress can reach it — so the only way out is a
# persistent `openshell forward` tunnel (gateway -> supervisor -> sandbox ->
# host port), supervised here as a systemd unit. Optional; runs only when
# openclaw_ui_enabled. Must run AFTER the target sandbox exists (16-sandboxes).
- name: OpenClaw UI port-forward
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  block:
    - name: Resolve the openshell CLI's absolute path
      ansible.builtin.shell: command -v openshell
      args: { executable: /bin/bash }
      register: _openshell_bin
      changed_when: false

    # 16-sandboxes' `sandbox create` returns as soon as the gateway ACCEPTS the
    # create request, not once the pod is actually Ready — on a fresh node the
    # sandbox image pull alone can take several minutes. Found live on a fresh
    # instance's first-ever provision: every `sandbox exec` task below ran
    # against a still-Init sandbox, failed silently (each wrapped in `|| true`
    # for idempotent re-runs), and the whole role completed "successfully"
    # with the Control UI simply never started — no error anywhere, just an
    # unreachable port. Wait for the phase to actually be Ready first.
    - name: Wait for the sandbox to be Ready before configuring it
      ansible.builtin.shell: |
        set -e
        openshell --gateway fleet sandbox list 2>/dev/null | awk -v n="{{ openclaw_ui_agent }}" '$1==n{print $NF}'
      args: { executable: /bin/bash }
      register: _openclaw_sandbox_phase
      retries: 60
      delay: 10
      until: "'Ready' in _openclaw_sandbox_phase.stdout"
      changed_when: false

    # `openclaw gateway run` only ever binds a port INSIDE the sandbox — nothing
    # starts it automatically, and a bare sandbox has no systemd to supervise it.
    # Everything below runs the in-sandbox setup once via `sandbox exec`, piping
    # each script in base64 (`sandbox exec ... -- sh -c "echo <b64> | base64 -d |
    # sh"`) rather than passing it as a literal argument or over stdin — plain
    # multi-line/quoted args got mangled across the CLI's own arg parsing, and
    # piping a script over stdin never returned at all (verified live: `sandbox
    # exec -- sh < script.sh` hangs indefinitely; the single -c-argument form
    # is what actually returns).
    - name: Allow the Control UI to be reached from any browser origin
      # Default browser-origin check only allows http://localhost:<port> and
      # http://127.0.0.1:<port> — anything reached via a public/Brev URL would
      # be rejected. Verified live: setting this to a wildcard and reconnecting
      # with an arbitrary Origin header still completes the WebSocket upgrade
      # (HTTP 101), so it genuinely opens it up, not just silences a warning.
      ansible.builtin.shell: |
        set -e
        payload='openclaw config set gateway.controlUi.allowedOrigins "[\"*\"]"'
        b64="$(printf '%s' "$payload" | base64 | tr -d '\n')"
        openshell --gateway fleet sandbox exec -n {{ openclaw_ui_agent }} -- sh -c "echo $b64 | base64 -d | sh"
      args: { executable: /bin/bash }
      changed_when: false
      failed_when: false

    # Requests arrive via the Brev edge's own reverse proxy (a separate Secure
    # Link subdomain fronting the forwarded port), which adds X-Forwarded-For/
    # -Proto headers OpenClaw doesn't trust by default — it refuses the request
    # with "proxy_attribution_required" (verified live). The actual immediate
    # peer as OpenClaw sees it is the openshell forward tunnel terminating
    # inside the sandbox's own netns (loopback), not Brev's edge IP, so
    # trusting loopback is enough — confirmed live with a spoofed
    # X-Forwarded-For header completing a real WebSocket upgrade (HTTP 101).
    - name: Trust the local forward tunnel's proxy headers
      ansible.builtin.shell: |
        set -e
        payload='openclaw config set gateway.trustedProxies "[\"127.0.0.1\",\"::1\"]"'
        b64="$(printf '%s' "$payload" | base64 | tr -d '\n')"
        openshell --gateway fleet sandbox exec -n {{ openclaw_ui_agent }} -- sh -c "echo $b64 | base64 -d | sh"
      args: { executable: /bin/bash }
      changed_when: false
      failed_when: false

    # Model access needs no onboarding: the image seeds OpenClaw's config to
    # LiteLLM, and the attached `litellm` provider supplies $LITELLM_API_KEY
    # (a placeholder the supervisor swaps for the real key).
    - name: Point the CLI's own gateway target at this gateway's real port + password
      ansible.builtin.shell: |
        set -e
        payload='openclaw config set gateway.port {{ openclaw_ui_port }} && openclaw config set gateway.auth.password "{{ openclaw_gateway_password }}"'
        b64="$(printf '%s' "$payload" | base64 | tr -d '\n')"
        openshell --gateway fleet sandbox exec -n {{ openclaw_ui_agent }} -- sh -c "echo $b64 | base64 -d | sh"
      args: { executable: /bin/bash }
      changed_when: false
      failed_when: false

    - name: Start (or restart) the in-sandbox OpenClaw Control UI gateway
      ansible.builtin.shell: |
        set -e
        script='cd /sandbox
        [ -f gateway.pid ] && kill "$(cat gateway.pid)" 2>/dev/null
        sleep 1
        setsid nohup openclaw gateway run --port {{ openclaw_ui_port }} --bind lan --auth password --password "{{ openclaw_gateway_password }}" --allow-unconfigured > /sandbox/gateway.log 2>&1 < /dev/null &
        echo $! > /sandbox/gateway.pid
        sleep 6
        tail -20 /sandbox/gateway.log'
        b64="$(printf '%s' "$script" | base64 | tr -d '\n')"
        openshell --gateway fleet sandbox exec -n {{ openclaw_ui_agent }} -- sh -c "echo $b64 | base64 -d | sh"
      args: { executable: /bin/bash }
      register: _openclaw_ui_start
      changed_when: "'[gateway] ready' in _openclaw_ui_start.stdout"
      failed_when: false

    # Device pairing: with `--auth password`, a browser that enters the correct
    # password is paired immediately; no separate approval step is needed.

    - name: Render the openclaw-forward systemd unit
      ansible.builtin.template:
        src: openclaw-forward.service.j2
        dest: /etc/systemd/system/openclaw-forward.service
        owner: root
        group: root
        mode: "0644"
      register: openclaw_forward_unit

    - name: Enable and (re)start openclaw-forward
      ansible.builtin.systemd:
        name: openclaw-forward
        daemon_reload: true
        enabled: true
        state: restarted

    - name: OpenClaw UI forward summary
      ansible.builtin.debug:
        msg:
          - "OpenClaw UI forwarded: host port {{ openclaw_ui_port }} -> sandbox {{ openclaw_ui_agent }}."
          - "Open Brev port {{ openclaw_ui_port }}, or locally: http://localhost:{{ openclaw_ui_port }}/"
          - "Control UI password: OPENCLAW_GATEWAY_PASSWORD in .sso-secrets.env (or set it in .env)."
          - "Managed by systemd unit 'openclaw-forward' (Restart=always — self-heals once the sandbox is Ready)."
