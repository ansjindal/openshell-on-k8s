# A tiny HTTP echo API for the "Providers" lesson: it answers every request
# with the method, path and headers it received, so you can see what actually
# leaves the sandbox (the real credential) versus what the agent holds (a
# placeholder). Python standard library only.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo
  namespace: lab-demo
data:
  echo.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Echo(BaseHTTPRequestHandler):
        def reply(self):
            n = int(self.headers.get("content-length") or 0)
            body = self.rfile.read(n).decode(errors="replace") if n else ""
            out = json.dumps({"method": self.command, "path": self.path,
                              "headers": {k.lower(): v for k, v in self.headers.items()},
                              "body": body}, indent=2).encode()
            self.send_response(200)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(out)))
            self.end_headers()
            self.wfile.write(out)
        do_GET = do_POST = do_PUT = do_DELETE = reply

        def log_message(self, fmt, *args):
            print(self.address_string(), fmt % args, flush=True)

    HTTPServer(("0.0.0.0", 8080), Echo).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: lab-demo
  labels: {app: echo}
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: echo
          image: python:3.13-alpine
          command: ["python", "-u", "/app/echo.py"]
          ports: [{containerPort: 8080, name: http}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes:
        - name: app
          configMap: {name: echo}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: lab-demo
spec:
  selector: {app: echo}
  ports: [{name: http, port: 8080, targetPort: 8080}]
