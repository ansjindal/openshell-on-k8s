# Provider profile for the lab's echo API (manifests/demo-echo/echo.yaml).
# The credential is sent as `Authorization: Bearer <token>`, only to this
# endpoint, and only on GET requests under /api/.
id: echo-api
display_name: Echo API (lab demo)
description: In-cluster echo service; shows what the upstream really receives
category: other
credentials:
  - name: token
    description: API token for the echo service
    env_vars: [ECHO_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [token]
endpoints:
  - host: echo.lab-demo.svc.cluster.local
    port: 8080
    protocol: rest
    enforcement: enforce
    rules:
      - allow: {method: GET, path: "/api/**"}
binaries:
  - "/**"
