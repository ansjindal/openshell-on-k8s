# The pi lab's sandbox policy: the lab baseline plus one grant, the public npm
# registry, read-only and for node only, so pi can be installed inside the
# sandbox. Model access comes from the `litellm` provider (_provider_litellm).
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  npm_registry:
    name: npm_registry
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
        # scoped packages are fetched as /@scope%2Fname
        allow_encoded_slash: true
    binaries:
      - path: /usr/bin/node
